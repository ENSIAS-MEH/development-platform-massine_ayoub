<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouthConnect — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-auth">
    <aside class="auth-hero" aria-hidden="true">
      <div class="auth-hero__content">
        <p class="auth-hero__logo">YouthConnect</p>
        <h1 class="auth-hero__title">Rejoins ta communauté.</h1>
        <p class="auth-hero__text">Découvre des activités près de chez toi, crée les tiennes et connecte-toi avec d’autres jeunes.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <p class="auth-card__logo-mobile">YouthConnect</p>
        <h1 class="auth-card__title">Welcome back</h1>
        <p class="auth-card__subtitle">
          Pas encore de compte ?
          <a href="signup.html">Sign up</a>
        </p>

        <div class="auth-error" id="authError" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required minlength="6">
              <button type="button" class="btn-toggle-pw" data-toggle-password="password" aria-label="Afficher le mot de passe">Show</button>
            </div>
          </div>

          <div class="auth-row">
            <div class="form-check">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember">Remember me</label>
            </div>
            <a href="#" class="auth-link" onclick="return false" title="Bientôt avec le backend">Forgot password?</a>
          </div>

          <button type="submit" class="btn-auth-submit">Log in</button>
        </form>

        <p class="auth-card__subtitle" style="margin-top:1.5rem;margin-bottom:0;text-align:center;font-size:0.8125rem">
          Frontend uniquement — les comptes sont stockés localement en attendant Spring Boot.
        </p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
