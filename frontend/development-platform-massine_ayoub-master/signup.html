<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouthConnect — Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-auth">
    <aside class="auth-hero" aria-hidden="true">
      <div class="auth-hero__content">
        <p class="auth-hero__logo">YouthConnect</p>
        <h1 class="auth-hero__title">Crée ton compte.</h1>
        <p class="auth-hero__text">Publie des activités, rejoins des événements et fais partie d’une communauté active.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <p class="auth-card__logo-mobile">YouthConnect</p>
        <h1 class="auth-card__title">Sign up</h1>
        <p class="auth-card__subtitle">
          Déjà inscrit ?
          <a href="login.html">Log in</a>
        </p>

        <div class="auth-error" id="authError" role="alert"></div>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Full name</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="Alex Chen" autocomplete="name" required minlength="2">
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6">
              <button type="button" class="btn-toggle-pw" data-toggle-password="password" aria-label="Afficher le mot de passe">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="password-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Repeat password" autocomplete="new-password" required minlength="6">
              <button type="button" class="btn-toggle-pw" data-toggle-password="confirmPassword" aria-label="Afficher le mot de passe">Show</button>
            </div>
          </div>

          <div class="form-check">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="#" onclick="return false">Terms of Service</a> and <a href="#" onclick="return false">Privacy Policy</a></label>
          </div>

          <button type="submit" class="btn-auth-submit">Create account</button>
        </form>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
